[phases.setup]
nixPkgs = ['nodejs-18_x']

[phases.install]
# npm 10+: use --omit=dev em vez da config deprecada `production` (NODE_ENV=production)
cmds = ['npm install --omit=dev', 'npx prisma generate']

[start]
# `node` direto evita o aviso npm 10+ sobre `config production` ao usar `npm start` com NODE_ENV=production
cmd = 'node src/server.js'