[phases.setup]
nixPkgs = ['nodejs-18_x']

[phases.install]
# npm 10+: use --omit=dev em vez da config deprecada `production` (NODE_ENV=production)
cmds = ['npm install --omit=dev', 'npx prisma generate']

[start]
# migrate deploy no boot: aplica tabelas quando DATABASE_URL existe (Railway injeta no runtime)
# `node` direto evita o aviso npm sobre `npm start` + NODE_ENV=production
cmd = 'npx prisma migrate deploy && node src/server.js'