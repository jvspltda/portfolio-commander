[phases.setup]
nixPkgs = ['nodejs-18_x']

[phases.install]
# npm 10+: use --omit=dev em vez da config deprecada `production` (NODE_ENV=production)
# NÃO rode migrate deploy no build: rede do Docker build costuma não alcançar o Supabase (P1001).
# Migrações rodam em scripts/start-prod.js (npm start), na rede do container em execução.
cmds = ['npm install --omit=dev', 'npx prisma generate']

[start]
cmd = 'node scripts/start-prod.js'